title: config
apps:
  api:
    port: integer
    privatePort: integer
    useCachingInterceptor: boolean
  cacheWarmer:
    port: integer
  queueWorker:
    port: integer
  transactionsProcessor:
    port: integer
    maxLookBehind: integer
libs:
  common:
    redis:
      host: string
      port: integer
      password:
        type: string
        required: false
    nativeAuth:
      maxExpirySeconds:
        type: integer
        default: 86400
      acceptedOrigins:
        type: array
        items: string
    security:
      admins:
        type: array
        items: string
        default: []
    rateLimiterSecret:
      type: string
      required: false
