# Redis Configuration for mx-template-service
# ACL-based access control: separate users for data operations and PubSub

# Load ACL file
aclfile /etc/redis/users.acl

# Bind to localhost only in Docker
bind 0.0.0.0

# Persistence
save 900 1
save 300 10
save 60 10000
appendonly yes

# Connection
tcp-keepalive 300
timeout 0
