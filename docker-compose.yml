version: '3.4'
services:
  redis:
    image: redis:7.2.4-alpine
    container_name: mx-tools-redis
    entrypoint: []
    command: /etc/redis/entrypoint.sh
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
      - ./monitoring/redis:/etc/redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    restart: always

  prometheus:
    image: prom/prometheus:v2.50.0
    command: '--config.file=/etc/prometheus/prometheus.yml'
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
    ports:
      - 9090:9090
    extra_hosts:
      - host.docker.internal:host-gateway

  grafana:
    depends_on:
      - prometheus
    image: grafana/grafana:10.3.3
    volumes:
      - ./monitoring/grafana:/etc/grafana/provisioning
    ports:
      - 3010:3000
volumes:
  redis_data:
